name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# the carray tests must run in CI: fail instead of skipping them
env:
  LUA_DIGEST_TEST_REQUIRE_CARRAY: '1'

jobs:
  test:
    name: lua ${{ matrix.luaVersion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ['5.1', '5.2', '5.3', '5.4', '5.5', 'luajit', 'luajit-openresty']
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua ${{ matrix.luaVersion }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.luaVersion }}

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install carray rock
        run: luarocks install carray

      - name: Build rock
        run: luarocks make rockspecs/digest-scm-0.rockspec

      - name: Run tests via run_tests.lua
        run: |
          eval "$(luarocks path --no-bin)"
          lua run_tests.lua

      - name: Run tests via luarocks test
        run: luarocks test rockspecs/digest-scm-0.rockspec

  macos:
    name: macos lua 5.5
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua 5.5
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.5'

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install carray rock
        run: luarocks install carray

      - name: Build rock
        run: luarocks make rockspecs/digest-scm-0.rockspec

      - name: Run tests via run_tests.lua
        run: |
          eval "$(luarocks path --no-bin)"
          lua run_tests.lua

      - name: Run tests via luarocks test
        run: luarocks test rockspecs/digest-scm-0.rockspec

  windows:
    name: windows lua 5.5 (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Remove conflicting Git link.exe
        # Git for Windows ships a coreutils "link" (hardlink tool) in usr/bin
        # that shadows MSVC's link.exe under the bash shell used below.
        run: rm -f "/usr/bin/link.exe"

      - name: Install Lua 5.5
        uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: '5.5'

      - name: Install LuaRocks
        uses: luarocks/gh-actions-luarocks@v7

      - name: Install carray rock
        run: luarocks install carray

      - name: Build rock
        run: luarocks make rockspecs/digest-scm-0.rockspec

      - name: Run tests via run_tests.lua
        # (gh-actions-luarocks already puts the rock tree on LUA_PATH/CPATH;
        #  `luarocks path` would print cmd.exe syntax here)
        run: lua run_tests.lua

      - name: Run tests via luarocks test
        run: luarocks test rockspecs/digest-scm-0.rockspec

  # Windows with MinGW gcc in addition to MSVC above: gcc (14+) rejects
  # constructs that MSVC only warns about (e.g. implicit declarations).
  windows-mingw:
    name: windows lua 5.5 (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      LR_BIN: luarocks-bin/luarocks-3.13.0-windows-64
      LUA_SRC: lua-5.5.0/src
    steps:
      - uses: actions/checkout@v6

      - name: Build Lua 5.5 from source (MinGW)
        run: |
          gcc --version | head -1
          curl -sL https://www.lua.org/ftp/lua-5.5.0.tar.gz -o lua.tar.gz
          tar xzf lua.tar.gz
          MAKE_BIN=$(command -v make || command -v mingw32-make)
          "$MAKE_BIN" -C lua-5.5.0 mingw

      - name: Install LuaRocks and build the rock
        run: |
          curl -sL https://luarocks.github.io/luarocks/releases/luarocks-3.13.0-windows-64.zip -o lr.zip
          mkdir luarocks-bin
          powershell -NoProfile -Command "Expand-Archive -Path lr.zip -DestinationPath luarocks-bin"
          export PATH="$PWD/$LR_BIN:$PWD/$LUA_SRC:$PATH"
          luarocks config variables.LUA_INCDIR "lua-5.5.0/src"
          luarocks config variables.LUA_LIBDIR "lua-5.5.0/src"
          luarocks config variables.CC gcc
          luarocks config variables.LD gcc
          luarocks --lua-version=5.5 --tree lrtree make rockspecs/digest-scm-0.rockspec
          # carray from its scm rockspec (GitHub master): the released carray
          # does not build with MinGW gcc 14 yet (missing <io.h> for read())
          luarocks --lua-version=5.5 --tree lrtree install https://luarocks.org/manifests/osch/carray-scm-0.rockspec

      - name: Run tests via run_tests.lua
        run: |
          export PATH="$PWD/$LUA_SRC:$PATH"
          export LUA_PATH='./lrtree/share/lua/5.5/?.lua;./lrtree/share/lua/5.5/?/init.lua;;'
          export LUA_CPATH='./lrtree/lib/lua/5.5/?.dll;;'
          lua run_tests.lua

      - name: Run tests via luarocks test
        run: |
          export PATH="$PWD/$LR_BIN:$PWD/$LUA_SRC:$PATH"
          export LUA_PATH='./lrtree/share/lua/5.5/?.lua;./lrtree/share/lua/5.5/?/init.lua;;'
          export LUA_CPATH='./lrtree/lib/lua/5.5/?.dll;;'
          luarocks --lua-version=5.5 --tree lrtree test rockspecs/digest-scm-0.rockspec

  warnings:
    name: gcc -Wall -Wextra -Wpedantic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua headers
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-dev

      - name: Compile with strict warnings
        run: gcc -O2 -Wall -Wextra -Wpedantic -Werror -DLUA_DIGEST_VERSION=scm -c -I/usr/include/lua5.4 -I. digestlib.c
